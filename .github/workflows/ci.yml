name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/api

    steps:
      - uses: actions/checkout@v4

      - name: Postavi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Projekt/api/requirements.txt

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Ruff provjera
        run: ruff check app/

      - name: Testovi
        run: pytest -q

  web:
    name: Web (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/web

    steps:
      - uses: actions/checkout@v4

      - name: Postavi Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Projekt/web/package-lock.json

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
